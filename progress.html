<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure Map · Cannon Cove</title>
<meta name="description" content="Verified revenue progress for the $0 to $100 experiment.">
<style>
:root{
 --ink:#152a38;--ink2:#274554;--muted:#607783;--paper:#fff8df;--paper2:#fffdf0;
 --sea:#73c9c2;--sea2:#b9ebe2;--deep:#1d6474;--coral:#ff806c;--gold:#f5c85b;
 --line:#c7d8cf;--white:#fff;--shadow:0 7px 0 rgba(21,42,56,.12),0 14px 30px rgba(21,42,56,.08);
 --pixel:"Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#e7f3ed;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55}
a{color:inherit}
button,a{touch-action:manipulation}
.pixel{font-family:var(--pixel);font-weight:900;letter-spacing:.01em}
.shell{min-height:100vh;background:
 radial-gradient(circle at 8% 10%,rgba(255,255,255,.75) 0 3px,transparent 4px),
 radial-gradient(circle at 88% 18%,rgba(255,255,255,.7) 0 2px,transparent 3px),
 linear-gradient(#d9efe9 0 28%,#eaf5ed 28% 100%)}
.topline{height:10px;background:repeating-linear-gradient(90deg,var(--coral) 0 18px,var(--gold) 18px 36px,var(--sea) 36px 54px)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:950}
.logo-mark{width:42px;height:42px;background:var(--coral);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;transform:rotate(-2deg)}
.logo-mark span{font-size:21px}
.pixel-box{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);position:relative}
.pixel-box:before{content:"";position:absolute;inset:6px;border:2px dashed rgba(39,69,84,.25);pointer-events:none}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}
.navlinks{display:flex;gap:8px;flex-wrap:wrap}
.navlinks a{padding:9px 11px;text-decoration:none;font-weight:800;color:var(--ink2);border:2px solid transparent}
.navlinks a:hover{background:var(--paper);border-color:var(--ink)}
.kicker{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:950;text-transform:uppercase;letter-spacing:.1em;color:var(--deep)}
.kicker:before{content:"✦";color:var(--coral)}
h1,h2,h3{line-height:1.05}
h1{font-family:var(--pixel);text-transform:uppercase}
h2{font-size:1.6rem}
.muted{color:var(--muted)}
.hero-art{background:linear-gradient(#8ed8d1 0 58%,#4f9db0 58% 73%,#f0d17b 73%);overflow:hidden;min-height:260px;display:flex;align-items:flex-end;justify-content:center;padding:24px;position:relative}
.hero-art .sun{position:absolute;width:72px;height:72px;background:#ffd96a;right:12%;top:28px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.hero-art .island{width:72%;height:90px;background:#d8b46a;border:3px solid var(--ink);position:relative;clip-path:polygon(0 75%,12% 45%,26% 52%,36% 25%,53% 42%,70% 18%,84% 52%,100% 38%,100% 100%,0 100%)}
.hero-art .cannon{position:absolute;bottom:46px;left:49%;width:72px;height:28px;background:var(--ink);transform:rotate(-14deg);box-shadow:6px 6px 0 rgba(21,42,56,.35)}
.hero-art .cannon:before{content:"";position:absolute;right:-18px;top:4px;width:28px;height:20px;background:var(--coral);border:3px solid var(--ink)}
.hero-art .flag{position:absolute;bottom:80px;left:34%;width:4px;height:75px;background:var(--ink)}
.hero-art .flag:after{content:"C";position:absolute;left:3px;top:2px;background:var(--gold);border:3px solid var(--ink);padding:3px 7px;font-family:var(--pixel);font-weight:900}
.chip{display:inline-block;padding:5px 9px;background:var(--sea2);border:2px solid var(--ink);font-size:.75rem;font-weight:950}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:950;padding:13px 16px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--coral);color:var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.secondary{background:var(--paper)}
.btn.gold{background:var(--gold)}
.stat{background:var(--paper2);border:3px solid var(--ink);padding:16px;box-shadow:4px 4px 0 rgba(21,42,56,.15)}
.stat strong{display:block;font-family:var(--pixel);font-size:1.45rem}
.stat span{font-size:.78rem;color:var(--muted);font-weight:800}
.progress{height:18px;background:#d6e2dc;border:3px solid var(--ink);padding:2px}
.bar{height:100%;width:0;background:repeating-linear-gradient(135deg,var(--coral) 0 10px,#ff9b85 10px 20px)}
.card{background:rgba(255,253,240,.92);border:3px solid var(--ink);box-shadow:var(--shadow);padding:24px}
.card h2{margin:0 0 10px}
.thesis{background:var(--sea2);border:3px solid var(--ink);padding:17px;margin:18px 0;font-family:var(--pixel);font-size:1.02rem;box-shadow:4px 4px 0 var(--ink)}
.roadmap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.step{background:#fff;border:3px solid var(--ink);padding:13px;min-height:128px}
.step .num{font-family:var(--pixel);font-size:.78rem;color:var(--coral)}
.step strong{display:block;margin:8px 0 5px}
.step span{font-size:.82rem;color:var(--muted)}
.quest{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:2px dashed var(--line)}
.quest:last-child{border-bottom:0}
.quest-icon{width:38px;height:38px;display:grid;place-items:center;background:var(--gold);border:3px solid var(--ink);font-family:var(--pixel);flex:none}
.tag{display:inline-block;border:2px solid var(--ink);background:var(--paper);padding:3px 8px;font-size:.72rem;font-weight:950}
.status-Testing{background:#fff0b8}.status-Active{background:#bff0e8}.status-Done{background:#cdecc8}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:38px 0 20px}
.pixel-divider{height:12px;background:linear-gradient(90deg,transparent 0 3%,var(--ink) 3% 5%,transparent 5% 8%,var(--ink) 8% 10%,transparent 10% 90%,var(--ink) 90% 92%,transparent 92% 95%,var(--ink) 95% 97%,transparent 97%)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style><script src="site-data.js"></script>
</head>
<body><div class="shell"><div class="topline"></div>
<div style="max-width:1050px;margin:auto;padding:24px 18px 60px">
<header class="nav pixel-box" style="padding:12px 14px;margin-bottom:24px"><a class="logo" href="index.html"><span class="logo-mark"><span>⚓</span></span><span class="pixel">TREASURE MAP</span></a><div class="navlinks"><a href="desktop.html">Home</a><a href="experiment-log.html">Log</a></div></header>
<section class="pixel-box" style="padding:30px;margin-bottom:18px"><span class="kicker">Revenue progress</span><h1 style="font-size:clamp(2rem,5vw,4rem);margin:14px 0">From $0 to $100</h1><p class="muted">Only verified earned revenue moves the treasure meter. Voluntary support and expenses stay separate.</p></section>
<section class="card"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div class="stat"><strong id="current">$0.00</strong><span>earned revenue</span></div><div class="stat"><strong>$100</strong><span>revenue goal</span></div><div class="stat"><strong id="percent">0%</strong><span>of goal</span></div></div></section>
<section class="card" style="margin-top:20px"><div class="kicker">Chart</div><h2>Cumulative earned revenue</h2><div style="height:360px;position:relative"><canvas id="incomeChart"></canvas></div></section>
<section class="card" style="margin-top:20px"><div class="kicker">Event timeline</div><div id="timeline"></div></section>
<footer><a href="mobile.html">Mobile home</a> · <a href="desktop.html">Desktop home</a> · <a href="experiment-log.html">Captain's log</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const events=EXPERIMENT.revenueEvents,goal=100;
let cumulative=0;const labels=[],values=[];
events.forEach(e=>{if(e.type==="Revenue")cumulative+=Number(e.amount);labels.push(e.label);values.push(cumulative)});
document.querySelector("#current").textContent="$"+cumulative.toFixed(2);
document.querySelector("#percent").textContent=Math.min(100,cumulative).toFixed(0)+"%";
new Chart(document.querySelector("#incomeChart"),{type:"line",data:{labels,datasets:[{label:"Cumulative earned revenue",data:values,borderWidth:4,pointRadius:6,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}},scales:{y:{beginAtZero:true,max:goal,title:{display:true,text:"Earned revenue (USD)"}}}}});
const box=document.querySelector("#timeline");
[...events].reverse().forEach(e=>{const row=document.createElement("div");row.className="quest";row.innerHTML=`<div class="quest-icon">${e.type==="Revenue"?"$":"•"}</div><div><div><span class="tag">${e.type}</span> <span class="muted">${e.date}</span></div><strong>${e.label}</strong><div class="muted">${e.note||""}${e.type==="Revenue"?" · +$"+Number(e.amount).toFixed(2):""}</div></div>`;box.appendChild(row)});
</script>
</div></body></html>
