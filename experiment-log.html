<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiment Log</title><style>*{box-sizing:border-box}body{margin:0;background:#e7f3ed;color:#172a36;font:16px/1.55 system-ui,sans-serif}a{color:inherit}.top{height:10px;background:repeating-linear-gradient(90deg,#ff806c 0 18px,#f5c85b 18px 36px,#76cbc4 36px 54px)}.wrap{max-width:1150px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.logo{font:bold 22px "Courier New",monospace;text-decoration:none}.links{display:flex;gap:14px;font-weight:800}.box,.card{background:#fff8df;border:3px solid #172a36;box-shadow:6px 6px 0 #172a36;padding:28px}.card{margin-top:20px;box-shadow:0 7px 0 #172a361f,0 14px 30px #172a3614}.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:450px;padding:0;overflow:hidden}.copy{padding:44px;display:flex;flex-direction:column;justify-content:center}.k{font-size:.76rem;font-weight:950;text-transform:uppercase;letter-spacing:.1em;color:#216879}.k:before{content:"✦ ";color:#ff806c}h1,h2{line-height:1.05}h1{font:900 clamp(3rem,6vw,6rem)/1 "Courier New",monospace;text-transform:uppercase;margin:16px 0}h2{font-size:1.7rem}.muted{color:#637a84}.art{position:relative;min-height:400px;background:linear-gradient(#8ed8d1 0 58%,#4f9db0 58% 73%,#f0d17b 73%)}.sun{position:absolute;right:12%;top:40px;width:75px;height:75px;background:#ffd96a;border:3px solid #172a36;box-shadow:5px 5px #172a36}.island{position:absolute;bottom:0;left:10%;width:80%;height:120px;background:#d8b46a;border:3px solid #172a36;clip-path:polygon(0 72%,12% 43%,27% 53%,38% 23%,54% 42%,70% 17%,85% 52%,100% 37%,100% 100%,0 100%)}.flag{position:absolute;bottom:105px;left:30%;width:4px;height:70px;background:#172a36}.flag:after{content:"$";position:absolute;left:3px;background:#f5c85b;border:3px solid #172a36;padding:3px 8px;font:900 18px "Courier New"}.rocket{position:absolute;left:48%;bottom:95px;width:70px;height:28px;background:#172a36;transform:rotate(-13deg)}.rocket:after{content:"";position:absolute;right:-22px;top:4px;width:30px;height:20px;background:#ff806c;border:3px solid #172a36}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{display:inline-block;padding:12px 16px;border:3px solid #172a36;box-shadow:4px 4px #172a36;text-decoration:none;font-weight:950;background:#ff806c}.btn.alt{background:#fff8df}.btn.gold{background:#f5c85b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{background:#fffdf2;border:3px solid #172a36;padding:15px}.stat strong{display:block;font:900 1.5rem "Courier New"}.meter{height:22px;background:#d7e2dc;border:3px solid #172a36;padding:2px}.bar{height:100%;width:0;background:#ff806c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini,.step{background:white;border:3px solid #172a36;padding:15px}.road{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.mini strong,.step strong{display:block;margin:8px 0}.tag{display:inline-block;border:2px solid #172a36;background:#fff8df;padding:3px 8px;font-size:.72rem;font-weight:900}.row{display:flex;gap:12px;padding:14px 0;border-bottom:2px dashed #c7d8cf}.row:last-child{border:0}.icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border:3px solid #172a36;background:#f5c85b;font-weight:900}footer{text-align:center;color:#637a84;padding:32px 0}@media(max-width:800px){.wrap{padding:14px 14px 82px}.links{display:none}.nav{position:sticky;top:8px;z-index:5;background:#e7f3edee;padding:8px 0}.hero{display:flex;flex-direction:column}.copy{padding:25px 20px}.copy h1{font-size:clamp(2.3rem,12vw,3.6rem)}.art{min-height:230px}.stats{grid-template-columns:1fr 1fr}.grid,.road{grid-template-columns:1fr}.box,.card{padding:19px}.actions{display:grid}.btn{text-align:center}.mobilebar{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);bottom:8px;left:10px;right:10px;z-index:10;background:#172a36;border:3px solid #172a36;box-shadow:0 5px #172a3622}.mobilebar a{color:white;text-decoration:none;text-align:center;padding:7px 2px;font-size:.68rem;font-weight:900}.mobilebar span{display:block;font-size:1rem}}@media(min-width:801px){.mobilebar{display:none}}</style><script src="site-data.js"></script></head><body><div class="top"></div><main class="wrap"><header class="nav"><a class="logo" href="index.html">✦ $0 → $100</a><a href="progress.html">Revenue</a></header><section class="box"><div class="k">Public experiment log</div><h1>Try things. Show the receipts.</h1><p class="muted">A running record of ideas, actions, results, and changes of direction. Cannon Cove is one project inside the experiment.</p></section><section class="card"><div class="k">Ideas</div><div id="ideas"></div></section><section class="card"><div class="k">Actions & results</div><div id="actions"></div></section><footer><a href="index.html">Home</a> · <a href="progress.html">Revenue</a></footer></main><script>function render(id,a,idea){a.slice().reverse().forEach(x=>document.querySelector(id).innerHTML+='<div class="row"><div class="icon">'+(idea?'✦':'✓')+'</div><div><span class="tag">'+(x.status||x.type)+'</span> '+x.date+'<strong style="display:block">'+x.title+'</strong><span class="muted">'+(x.description||x.result)+'</span></div></div>')}render("#ideas",EXPERIMENT.ideas,true);render("#actions",EXPERIMENT.actions,false);</script></body></html>
